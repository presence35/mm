<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfcff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101418" />
    <title>Marina Manager</title>
    <script>
      // Applied before first paint so a dark-mode user never sees a light flash.
      try {
        var t = localStorage.getItem('mm.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
